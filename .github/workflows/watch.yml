name: FX Watch

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may run it a few minutes late)
  issues:                   # the dashboard's "add holding" forms open a GitHub issue; this applies it
    types: [opened]
  workflow_dispatch:        # "Run workflow" button for a manual check
    inputs:
      test_email:
        description: "Only send a test email (to check the email secrets)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: fx-watch
  cancel-in-progress: false

jobs:
  watch:
    # on issue events, only act on wallet requests opened by the repo owner (never by strangers or alert issues)
    if: ${{ github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'FX wallet')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply wallet request from the dashboard
        if: ${{ github.event_name == 'issues' }}
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python watch.py --wallet-issue
      - name: Send test email
        if: ${{ inputs.test_email }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch.py --test-email
      - name: Check rates, send signals, build dashboard
        if: ${{ !inputs.test_email }}
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python watch.py
      - name: Save rate history and signal state
        if: always()
        continue-on-error: true
        run: |
          git config user.name "fx-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data wallet.json 2>/dev/null || git add data
          git commit -m "rates $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() }}
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() }}
        with:
          path: docs
      - id: deploy
        if: ${{ !cancelled() }}
        uses: actions/deploy-pages@v4
      - name: Show dashboard address
        if: ${{ !cancelled() }}
        run: echo "Dashboard - ${{ steps.deploy.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
      - name: Reply to wallet request
        if: ${{ github.event_name == 'issues' && !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body-file out/wallet_result.md || true
          gh issue close "$NUM" || true
