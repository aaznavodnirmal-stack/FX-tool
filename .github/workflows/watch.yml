name: FX Watch

on:
  schedule:
    - cron: "17 * * * *"   # every hour at :17 (GitHub may run it a few minutes late)
  issues:                   # the dashboard's "add holding" forms open a GitHub issue; this applies it
    types: [opened]
  workflow_dispatch:        # "Run workflow" button for a manual check
    inputs:
      test_email:
        description: "Only send a test email (to check the email secrets)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: fx-watch
  cancel-in-progress: false

jobs:
  watch:
    # on issue events, only act on wallet requests opened by the repo owner (never strangers, never alert issues)
    if: ${{ github.event_name != 'issues' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'FX wallet')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      EMAIL_USER: ${{ secrets.EMAIL_USER }}
      EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply wallet request from the dashboard
        if: ${{ github.event_name == 'issues' }}
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python watch.py --wallet-issue

      - name: Send test email
        if: ${{ inputs.test_email }}
        run: python watch.py --test-email

      - name: Check rates, send signals, build dashboard
        if: ${{ !inputs.test_email }}
        run: python watch.py

      # route 1: publish straight to Pages (used when Source = GitHub Actions)
      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && !inputs.test_email }}
        continue-on-error: true
      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && !inputs.test_email }}
        continue-on-error: true
        with:
          path: site
      - id: deploy
        if: ${{ !cancelled() && !inputs.test_email }}
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # route 2: commit index.html at the repo root (used when Source = Deploy from a branch)
      # also saves the rate history, signal memory and wallet, always on top of the newest commit
      - name: Save dashboard, rate history and wallet
        if: always()
        continue-on-error: true
        run: |
          rm -rf /tmp/keep && mkdir -p /tmp/keep
          cp -r data /tmp/keep/ 2>/dev/null || true
          cp wallet.json /tmp/keep/ 2>/dev/null || true
          cp index.html /tmp/keep/ 2>/dev/null || true
          [ -d /tmp/keep/data ] || [ -f /tmp/keep/index.html ] || { echo "nothing to save"; exit 0; }
          git config user.name "fx-watch"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            [ -d /tmp/keep/data ] && { rm -rf data; cp -r /tmp/keep/data data; }
            cp /tmp/keep/wallet.json wallet.json 2>/dev/null || true
            cp /tmp/keep/index.html index.html 2>/dev/null || true
            touch .nojekyll
            git rm -r -q --cached --ignore-unmatch docs >/dev/null 2>&1 || true
            git add -A data wallet.json index.html .nojekyll 2>/dev/null || true
            if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
            git commit -q -m "rates $(date -u +%Y-%m-%dT%H:%MZ)"
            if git push -q origin HEAD:main; then echo "saved"; exit 0; fi
            sleep $((i * 3))
          done
          echo "could not save after 5 tries"; exit 1

      - name: Is the dashboard live?
        if: ${{ !cancelled() && !inputs.test_email }}
        run: |
          mode=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages mode: $mode   Address: $SITE"
          echo "### Dashboard: $SITE" >> "$GITHUB_STEP_SUMMARY"
          sleep 60                                   # GitHub needs a moment to serve the new page
          for i in 1 2 3; do
            body=$(curl -fsSL --max-time 30 "$SITE" || true)
            case "$body" in
              *FX_SNAPSHOT*) echo "The live page is showing the dashboard."
                             echo "The live page is showing the dashboard (press Ctrl+F5 if your browser shows an old copy)." >> "$GITHUB_STEP_SUMMARY"
                             exit 0 ;;
            esac
            sleep 30
          done
          echo "::warning::The live page is NOT showing the dashboard yet (Pages mode: $mode)."
          {
            echo "**The live page is still showing something else.**"
            echo ""
            echo "- Pages mode reported: \`$mode\` (\`workflow\` = GitHub Actions, \`legacy\` = Deploy from a branch)."
            echo "- If it is \`legacy\`, open **Settings > Pages > Build and deployment** and make sure **Branch** is \`main\` and the folder is **/ (root)**. The dashboard is committed as \`index.html\` at the root, so that works."
            echo "- If it is \`workflow\`, check the deploy step above for a red cross."
            echo "- A branch build can take a few minutes; check the **pages build and deployment** run in Actions."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reply to wallet request
        if: ${{ github.event_name == 'issues' && !cancelled() }}
        env:
          GH_REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$NUM" --body-file out/wallet_result.md || true
          gh issue close "$NUM" || true
